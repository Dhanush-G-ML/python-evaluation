name: Submission progress

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      topics:
        description: "Topics (for example 1,3-5 or all)"
        default: all
        type: string
      users:
        description: "First names (for example Sahana,Dhanya or all)"
        default: all
        type: string

permissions:
  contents: read

jobs:
  progress:
    name: Generate progress CSV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate CSV
        env:
          TOPICS: ${{ inputs.topics || 'all' }}
          USERS: ${{ inputs.users || 'all' }}
        run: python tools/submission_progress.py --topic "$TOPICS" --user "$USERS" --output report/submission-progress.csv
      - uses: actions/upload-artifact@v7
        with:
          name: submission-progress
          path: report/submission-progress.csv
          if-no-files-found: error
          retention-days: 14
