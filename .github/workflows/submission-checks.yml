name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Submission checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check branch, scope and syntax
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          git show "$BASE_SHA:tools/check_submission.py" > "$RUNNER_TEMP/check_submission.py"
          python -I "$RUNNER_TEMP/check_submission.py" --branch "$PR_BRANCH" --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR" --owner "$REPO_OWNER"
